[project]
name = "dmg-nepal-gis"
version = "0.1.0"
description = "Download and map open data from the Department of Mines and Geology (Nepal) GIS portal"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "matplotlib>=3.8",
    "contextily>=1.6",
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.scripts]
dmg-gis = "dmg_gis:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmg_gis"]
